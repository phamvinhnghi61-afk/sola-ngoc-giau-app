name: Build Solar Ngoc Giau APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Solar Ngoc Giau App Launcher Icon
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -d "android/app/src/main/res/$dir" ]; then
              cp www/icon-192.png "android/app/src/main/res/$dir/ic_launcher.png"
              cp www/icon-192.png "android/app/src/main/res/$dir/ic_launcher_round.png"
              cp www/icon-512.png "android/app/src/main/res/$dir/ic_launcher_foreground.png"
            fi
          done

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Ngoc-Giau-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
