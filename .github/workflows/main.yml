name: Build Solar Ngoc Giau APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Solar Ngoc Giau App Launcher Icon
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp www/icon-192.png "$dir/ic_launcher.png" || true
              cp www/icon-192.png "$dir/ic_launcher_round.png" || true
              cp www/icon-512.png "$dir/ic_launcher_foreground.png" || true
            fi
          done

      - name: Build Debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Solar-Ngoc-Giau-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
